# This function verifies the user's JWT with Auth and the current admin
# membership itself. The gateway legacy JWT check does not accept every
# signing-key configuration; it must not replace the in-function checks.
[functions.club-users]
verify_jwt = false

# RFC 9728 discovery is public. club-mcp verifies asymmetric JWT signatures,
# issuer, MCP audience, read-only role and live club/team access itself.
[functions.club-mcp]
verify_jwt = false
